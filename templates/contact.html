{% extends 'base.html' %}

{% block title %}Contact | Skyline Builders{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="text-center mb-4">Contact Us</h1>

    <form>

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label>Message</label>
            <textarea class="form-control" rows="5"></textarea>
        </div>

        <button class="btn btn-primary">
            Send Message
        </button>

    </form>

</div>

{% endblock %}
